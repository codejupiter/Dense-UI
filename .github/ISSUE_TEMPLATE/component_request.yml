name: Component request
description: Propose a new component or primitive.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What dense operational workflow does this component support?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior
      description: Describe the smallest useful version of the component.
    validations:
      required: true
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility considerations
      description: Keyboard, focus, labeling, screen-reader, or motion concerns.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing primitives, app-level composition, or third-party libraries that could solve this.
